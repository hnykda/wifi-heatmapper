[package]
name = "wifi-heatmapper-desktop"
version = "0.5.0"
description = "WiFi Heatmapper desktop shell: runs the bundled Next.js server and shows it in a window"
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "wifi-heatmapper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Job Object that ends the server's process tree with the app (src/windows_job.rs).
# Same version Tauri already pulls in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
