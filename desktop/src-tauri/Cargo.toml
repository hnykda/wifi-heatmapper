[package]
name = "wifi-heatmapper-desktop"
version = "0.5.0"
description = "WiFi Heatmapper desktop shell: runs the bundled Next.js server and shows it in a window"
edition = "2021"
rust-version = "1.77"
publish = false

[[bin]]
name = "wifi-heatmapper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
