<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WiFi Heatmapper</title>
    <!--
      Tauri's frontendDist (../src-tauri/tauri.conf.json). The window opens here
      while the bundled server starts, and comes back here if it stops.
      Hand-written, no build step, no network: it must render offline.
      Status shape: ServerStatus in ../src-tauri/src/main.rs.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: hsl(220 14% 97%);
        --fg: hsl(222 20% 12%);
        --muted: hsl(220 9% 44%);
        --border: hsl(220 13% 88%);
        --surface: hsl(220 14% 93%);
        --brand: hsl(252 56% 57%);
        --danger: hsl(0 72% 51%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: hsl(222 16% 9%);
          --fg: hsl(220 14% 93%);
          --muted: hsl(220 9% 62%);
          --border: hsl(222 14% 20%);
          --surface: hsl(222 14% 14%);
          --brand: hsl(252 70% 70%);
          --danger: hsl(0 72% 62%);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(40rem, 100% - 2rem); text-align: center; }
      svg { width: 48px; height: 48px; }
      h1 { font-size: 1.1rem; font-weight: 600; margin: 1rem 0 .25rem; }
      p { margin: .25rem 0; color: var(--muted); }
      .problem h1 { color: var(--danger); }
      pre {
        text-align: left;
        max-height: 18rem;
        overflow: auto;
        margin: 1rem 0 0;
        padding: .75rem .9rem;
        border: 1px solid var(--border);
        border-radius: .5rem;
        background: var(--surface);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
      }
      .row { display: flex; gap: .5rem; justify-content: center; margin-top: 1rem; }
      button {
        font: inherit;
        padding: .45rem .9rem;
        border-radius: .5rem;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      [hidden] { display: none !important; }
      .dot { animation: pulse 1.2s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 50% { opacity: .35; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main id="view">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.5 12.5a9 9 0 0 1 15 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M8 16a4.5 4.5 0 0 1 8 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <circle class="dot" cx="12" cy="19.5" r="2" fill="var(--brand)" />
      </svg>
      <h1 id="title">Starting WiFi Heatmapper…</h1>
      <p id="message"></p>
      <pre id="detail" hidden></pre>
      <div class="row" id="actions" hidden>
        <button class="primary" id="retry" type="button">Try again</button>
        <button id="log" type="button">Show log file</button>
      </div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);

      function invoke(cmd, args) {
        const fn = window.__TAURI_INTERNALS__?.invoke;
        return fn ? fn(cmd, args) : Promise.reject(new Error("not running in the app"));
      }

      function show({ title, message = "", detail = "", problem = false }) {
        $("view").classList.toggle("problem", problem);
        $("title").textContent = title;
        $("message").textContent = message;
        $("detail").textContent = detail;
        $("detail").hidden = !detail;
        $("actions").hidden = !problem;
      }

      function describe(status) {
        switch (status.state) {
          case "timed_out":
            return {
              title: "This is taking longer than usual",
              message:
                "The app's server is running but has not answered yet. This page opens the app as soon as it does.",
              detail: status.stderr,
            };
          case "spawn_failed":
            return {
              title: "The app's server could not be started",
              message: "The app may be damaged. Reinstalling it usually fixes this.",
              detail: status.error,
              problem: true,
            };
          case "exited": {
            const how = status.code == null ? "was stopped" : `exited with code ${status.code}`;
            return {
              title: "The app's server stopped",
              message: `It ${how}.${status.stderr ? " Its last output is below." : ""} The full log is in ${status.log || "the app's log folder"}.`,
              detail: status.stderr,
              problem: true,
            };
          }
          default:
            return { title: "Starting WiFi Heatmapper…" };
        }
      }

      async function poll() {
        let status;
        try {
          status = await invoke("server_status");
        } catch (err) {
          show({ title: "Not running inside the app", message: String(err), problem: false });
          return;
        }
        if (status.state === "ready") {
          location.replace(status.url);
          return;
        }
        show(describe(status));
        if (status.state === "starting" || status.state === "timed_out") {
          setTimeout(poll, 150);
        }
      }

      $("retry").addEventListener("click", () => invoke("relaunch"));
      $("log").addEventListener("click", () => invoke("reveal_log"));
      poll();
    </script>
  </body>
</html>
